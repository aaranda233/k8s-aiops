{{- if and .Values.remediation.enabled (not .Values.smtp.existingSecret) (or .Values.smtp.user .Values.remediation.teamsWebhookUrl) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "k8s-aiops.fullname" . }}-smtp
  labels:
    {{- include "k8s-aiops.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.remediation.teamsWebhookUrl }}
  TEAMS_WEBHOOK_URL: {{ .Values.remediation.teamsWebhookUrl | quote }}
  {{- end }}
  {{- if .Values.smtp.user }}
  SMTP_HOST: {{ .Values.smtp.host | quote }}
  SMTP_PORT: {{ .Values.smtp.port | quote }}
  SMTP_USER: {{ .Values.smtp.user | quote }}
  SMTP_PASS: {{ .Values.smtp.password | quote }}
  SMTP_FROM: {{ .Values.smtp.from | quote }}
  NOTIFY_EMAIL: {{ .Values.smtp.notifyEmail | quote }}
  {{- end }}
{{- end }}
