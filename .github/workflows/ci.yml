name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # drain3 0.9.11 fija cachetools==4.2.1 pero mlflow requiere >=5.0.0;
          # drain3 funciona con 5.x en runtime, así que lo instalamos sin pins rígidos
          pip install "cachetools>=5.0.0,<6" "jsonpickle>=2.0"
          pip install --no-deps drain3==0.9.11
          grep -v '^drain3' requirements.txt > /tmp/req.txt
          pip install -r /tmp/req.txt
          pip install pytest pytest-cov ruff

      - name: Lint with ruff
        run: ruff check src/ tests/ config/ eval/ --output-format=github
        continue-on-error: true

      - name: Run tests
        run: pytest tests/ -v --cov=src --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t k8s-aiops:ci .
