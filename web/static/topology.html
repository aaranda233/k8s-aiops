<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K8s-AIOps — Topología del cluster</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
  :root {
    --bg:#0f1117; --surface:#181b24; --surface2:#1f2330; --border:#2a2f3d; --text:#e6e8ee; --muted:#9aa3b2;
    --ingress:#a78bfa; --service:#38bdf8; --pod:#34d399; --node:#fbbf24;
    --ok:#22c55e; --warn:#eab308; --error:#ef4444; --mono:'SF Mono',Menlo,monospace;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  header { padding:14px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:14px; }
  header h1 { font-size:17px; font-weight:700; }
  header .sub { color:var(--muted); font-size:13px; }
  .nav { margin-left:auto; display:flex; gap:16px; font-size:14px; }
  .nav a { color:var(--muted); text-decoration:none; }
  .nav a:hover, .nav a.active { color:var(--text); }
  .bar { padding:8px 24px; border-bottom:1px solid var(--border); display:flex; gap:16px; align-items:center; font-size:13px; flex-wrap:wrap; }
  .stat { color:var(--muted); }
  .stat b { color:var(--text); font-size:15px; }
  .toggle { display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .toggle button { background:var(--surface); color:var(--muted); border:none; padding:5px 14px; font-size:13px; font-family:inherit; cursor:pointer; }
  .toggle button.active { background:var(--service); color:#03212e; font-weight:600; }
  .legend { display:flex; gap:14px; margin-left:auto; align-items:center; }
  .legend span { display:flex; align-items:center; gap:5px; color:var(--muted); font-size:12px; }
  .dot { width:10px; height:10px; border-radius:50%; }
  select { background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:4px 8px; font-size:13px; }
  #stage { flex:1; position:relative; overflow:hidden; }
  /* --- vista grafo --- */
  svg { width:100%; height:100%; display:block; cursor:grab; }
  svg:active { cursor:grabbing; }
  .link { stroke:#3a4150; stroke-opacity:0.5; }
  .link.routes { stroke:var(--ingress); stroke-opacity:0.6; }
  .node circle { stroke:#0f1117; stroke-width:1.5px; cursor:pointer; }
  .node text { font-size:9px; fill:var(--muted); pointer-events:none; }
  .node.err circle { stroke:var(--error); stroke-width:2.5px; }
  /* --- vista cuadro eléctrico --- */
  #panel { position:absolute; inset:0; overflow-y:auto; padding:18px 24px; display:none; }
  .mains { display:flex; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .main-mod { background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--node); border-radius:8px; padding:10px 16px; min-width:170px; }
  .main-mod.err { border-left-color:var(--error); }
  .main-mod .t { font-size:13px; font-weight:600; }
  .main-mod .s { font-size:12px; color:var(--muted); }
  .panels { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:14px; }
  .board { background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .board.has-fault { border-color:var(--error); box-shadow:0 0 0 1px rgba(239,68,68,.3); }
  .board-head { padding:10px 14px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; background:var(--surface2); }
  .board-head .ns { font-weight:600; font-size:14px; }
  .board-head .fault { margin-left:auto; font-size:11px; background:rgba(239,68,68,.15); color:var(--error); padding:2px 8px; border-radius:10px; font-weight:600; }
  .board-head .okbadge { margin-left:auto; font-size:11px; color:var(--ok); }
  .breakers { display:grid; grid-template-columns:repeat(auto-fill, 26px); gap:5px; padding:12px 14px; }
  .breaker { width:26px; height:26px; border-radius:4px; cursor:pointer; position:relative; border:1px solid rgba(0,0,0,.3); transition:transform .1s; }
  .breaker:hover { transform:scale(1.25); z-index:2; }
  .breaker.ok { background:var(--ok); } .breaker.warn { background:var(--warn); }
  .breaker.error { background:var(--error); } .breaker.unknown { background:#555; }
  .board-foot { padding:8px 14px; border-top:1px solid var(--border); font-size:11px; color:var(--muted); display:flex; gap:12px; flex-wrap:wrap; }
  .board-foot .chip { display:flex; align-items:center; gap:4px; }
  #detail { position:absolute; top:14px; right:14px; width:280px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 16px; font-size:13px; display:none; z-index:5; }
  #detail h3 { font-size:14px; margin-bottom:8px; word-break:break-all; }
  #detail .row { color:var(--muted); margin:3px 0; }
  #detail .row b { color:var(--text); }
  #detail .close { float:right; cursor:pointer; color:var(--muted); }
  .loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>🛡️ K8s-AIOps</h1><span class="sub">Topología del cluster · cuadro eléctrico</span>
  <div class="nav">
    <a href="/">Dashboard</a><a href="/incidents">Incidencias</a>
    <a href="/chat">Chat</a><a href="/topology" class="active">Topología</a>
  </div>
</header>
<div class="bar">
  <div class="toggle">
    <button id="t-panel" class="active" onclick="setView('panel')">⊞ Cuadro</button>
    <button id="t-graph" onclick="setView('graph')">⊹ Grafo</button>
  </div>
  <span class="stat"><b id="s-node">0</b> nodos</span>
  <span class="stat"><b id="s-svc">0</b> servicios</span>
  <span class="stat"><b id="s-ing">0</b> ingress</span>
  <span class="stat"><b id="s-pod">0</b> pods</span>
  <span class="stat"><b id="s-err" style="color:var(--error)">0</b> con fallo</span>
  <select id="ns-filter"><option value="">todos los namespaces</option></select>
  <div class="legend">
    <span><span class="dot" style="background:var(--ok)"></span>ok</span>
    <span><span class="dot" style="background:var(--warn)"></span>warn</span>
    <span><span class="dot" style="background:var(--error)"></span>fallo</span>
  </div>
</div>
<div id="stage">
  <div class="loading" id="loading">Cargando topología del cluster…</div>
  <div id="panel"></div>
  <div id="detail"></div>
</div>

<script>
const TYPE_COLOR = { ingress:"#a78bfa", service:"#38bdf8", pod:"#34d399", node:"#fbbf24" };
const TYPE_SIZE  = { ingress:9, service:7, pod:5, node:14 };
let allData = null, sim = null, view = "panel", nsFilter = "";

function colorFor(n){
  if (n.health === "error") return "#ef4444";
  if (n.health === "warn")  return "#eab308";
  return TYPE_COLOR[n.type] || "#888";
}
function esc(s){ return (s||"").replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function setText(id, v){ const el=document.getElementById(id); if(el) el.textContent=v; }

function setView(v){
  view = v;
  document.getElementById("t-panel").classList.toggle("active", v==="panel");
  document.getElementById("t-graph").classList.toggle("active", v==="graph");
  if (allData) render();
}

function filtered(){
  if (!nsFilter) return allData;
  const keep = new Set(allData.nodes.filter(n=>n.namespace===nsFilter).map(n=>n.id));
  allData.links.forEach(l=>{ if(keep.has(l.source)) keep.add(l.target); if(keep.has(l.target)) keep.add(l.source); });
  return { nodes: allData.nodes.filter(n=>keep.has(n.id)), links: allData.links, stats: allData.stats };
}

function render(){
  const data = filtered();
  const svg = document.querySelector("#stage svg");
  const panel = document.getElementById("panel");
  if (view === "graph"){
    panel.style.display = "none";
    renderGraph(data);
  } else {
    if (svg) svg.remove();
    panel.style.display = "block";
    renderPanel(data);
  }
}

/* ---------- VISTA CUADRO ELÉCTRICO ---------- */
function renderPanel(data){
  const panel = document.getElementById("panel");
  // nodos k8s (mains)
  const knodes = data.nodes.filter(n=>n.type==="node");
  const mains = knodes.map(n=>`
    <div class="main-mod ${n.health==="error"?"err":""}" onclick='showDetail(${JSON.stringify(n)})'>
      <div class="t">🔌 ${esc(n.label)}</div>
      <div class="s">${esc(n.status)}</div>
    </div>`).join("");

  // agrupar por namespace
  const groups = {};
  data.nodes.forEach(n=>{
    if (!n.namespace) return;
    const g = groups[n.namespace] = groups[n.namespace] || {pods:[], svc:0, ing:0};
    if (n.type==="pod") g.pods.push(n);
    else if (n.type==="service") g.svc++;
    else if (n.type==="ingress") g.ing++;
  });

  // ordenar: namespaces con fallos primero, luego por nº de pods
  const order = Object.keys(groups).sort((a,b)=>{
    const fa = groups[a].pods.filter(p=>p.health==="error").length;
    const fb = groups[b].pods.filter(p=>p.health==="error").length;
    if (fb!==fa) return fb-fa;
    return groups[b].pods.length - groups[a].pods.length;
  });

  const boards = order.map(ns=>{
    const g = groups[ns];
    const faults = g.pods.filter(p=>p.health==="error").length;
    const breakers = g.pods.map(p=>
      `<div class="breaker ${p.health}" title="${esc(p.label)} · ${esc(p.status)}" onclick='showDetail(${JSON.stringify(p)})'></div>`
    ).join("");
    return `
    <div class="board ${faults?"has-fault":""}">
      <div class="board-head">
        <span class="ns">${esc(ns)}</span>
        ${faults ? `<span class="fault">${faults} ⚠</span>` : `<span class="okbadge">● ok</span>`}
      </div>
      <div class="breakers">${breakers || '<span style="color:var(--muted);font-size:12px">sin pods</span>'}</div>
      <div class="board-foot">
        <span class="chip">${g.pods.length} pods</span>
        <span class="chip">${g.svc} svc</span>
        ${g.ing ? `<span class="chip">${g.ing} ingress</span>` : ""}
      </div>
    </div>`;
  }).join("");

  panel.innerHTML = `
    ${mains ? `<div class="mains">${mains}</div>` : ""}
    <div class="panels">${boards}</div>`;
}

/* ---------- VISTA GRAFO (D3 force) ---------- */
function renderGraph(data){
  const g = document.getElementById("stage");
  d3.select("#stage svg").remove();
  const W = g.clientWidth, H = g.clientHeight;
  const svg = d3.select("#stage").insert("svg", "#panel");
  const zoomG = svg.append("g");
  svg.call(d3.zoom().scaleExtent([0.15, 4]).on("zoom", e => zoomG.attr("transform", e.transform)));

  const nodes = data.nodes.map(d=>({...d}));
  const ids = new Set(nodes.map(n=>n.id));
  const links = data.links.filter(l=>ids.has(l.source)&&ids.has(l.target)).map(d=>({...d}));

  sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d=>d.id).distance(d=>d.kind==="routes"?70:40))
    .force("charge", d3.forceManyBody().strength(-60))
    .force("center", d3.forceCenter(W/2, H/2))
    .force("collide", d3.forceCollide().radius(d=>(TYPE_SIZE[d.type]||5)+3));

  const link = zoomG.append("g").selectAll("line").data(links).join("line")
    .attr("class", d=>"link "+d.kind).attr("stroke-width", d=>d.kind==="routes"?1.5:1);
  const node = zoomG.append("g").selectAll("g").data(nodes).join("g")
    .attr("class", d=>"node"+(d.health==="error"?" err":""))
    .call(d3.drag()
      .on("start",(e,d)=>{ if(!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
      .on("drag",(e,d)=>{ d.fx=e.x; d.fy=e.y; })
      .on("end",(e,d)=>{ if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }));
  node.append("circle").attr("r", d=>TYPE_SIZE[d.type]||5).attr("fill", colorFor)
    .on("click",(e,d)=>showDetail(d));
  node.append("text").attr("x", d=>(TYPE_SIZE[d.type]||5)+3).attr("y", 3)
    .text(d=> d.type==="pod" ? "" : d.label);
  sim.on("tick", ()=>{
    link.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
    node.attr("transform", d=>`translate(${d.x},${d.y})`);
  });
}

function showDetail(d){
  const el = document.getElementById("detail");
  el.style.display = "block";
  el.innerHTML = `<span class="close" onclick="document.getElementById('detail').style.display='none'">✕</span>
    <h3>${esc(d.label)}</h3>
    <div class="row">Tipo: <b>${d.type}</b></div>
    ${d.namespace?`<div class="row">Namespace: <b>${esc(d.namespace)}</b></div>`:""}
    <div class="row">Estado: <b>${esc(d.status)}</b></div>
    <div class="row">Salud: <b style="color:${colorFor(d)}">${d.health}</b></div>
    ${d.type==="pod"?`<div class="row" style="margin-top:8px"><a href="/chat" style="color:#38bdf8">Preguntar al chat sobre este pod →</a></div>`:""}`;
}

async function load(){
  try {
    const r = await fetch("/api/topology");
    allData = await r.json();
  } catch(e){
    document.getElementById("loading").textContent = "Error cargando la topología: " + e; return;
  }
  document.getElementById("loading").style.display = "none";
  if (allData.error){
    const l=document.getElementById("loading"); l.style.display="flex"; l.textContent="Error: "+allData.error; return;
  }
  const st = allData.stats || {};
  setText("s-node", st.nodes||0); setText("s-svc", st.services||0);
  setText("s-ing", st.ingresses||0); setText("s-pod", st.pods||0); setText("s-err", st.unhealthy||0);
  const sel = document.getElementById("ns-filter");
  if (sel.options.length <= 1){
    [...new Set((allData.nodes||[]).map(n=>n.namespace).filter(Boolean))].sort()
      .forEach(ns=>{ const o=document.createElement("option"); o.value=ns; o.textContent=ns; sel.appendChild(o); });
  }
  render();
}

document.getElementById("ns-filter").addEventListener("change", e=>{ nsFilter = e.target.value; if(allData) render(); });

load();
setInterval(load, 20000);
</script>
</body>
</html>
