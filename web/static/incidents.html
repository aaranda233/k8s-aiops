<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K8s-AIOps · Incidencias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0d13; --panel:#141a26; --panel2:#1a212f; --rail:#0c1018;
    --border:#222a3a; --border-soft:#1a2130; --text:#e8ebf2; --muted:#8b94a7; --muted2:#5c6577;
    --accent:#4f8ff7; --teal:#2dd4bf; --ok:#3fb950; --warn:#d29922; --error:#f85149; --purple:#bc8cff;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 12px 32px -8px rgba(0,0,0,.6);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Inter',system-ui,sans-serif; background:
      radial-gradient(1200px 600px at 75% -10%, rgba(79,143,247,.05), transparent), var(--bg);
      color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased; }
  svg.icon { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; }

  header { padding:0 22px; height:56px; border-bottom:1px solid var(--border-soft); display:flex; align-items:center; gap:13px;
      background:rgba(10,13,19,.7); backdrop-filter:blur(8px); position:sticky; top:0; z-index:10; }
  .logo { display:flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:8px;
      background:linear-gradient(135deg,#1e3a6e,#0f1d38); border:1px solid #2a467e; color:#7fb0ff; }
  .brand { font-size:15px; font-weight:700; letter-spacing:-.01em; }
  .brand span { color:var(--muted2); font-weight:500; }
  .live { margin-left:auto; display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted); }
  .pulse { width:8px; height:8px; border-radius:50%; background:var(--ok); box-shadow:0 0 6px rgba(63,185,80,.7); animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  .nav { display:flex; gap:4px; }
  .nav a { color:var(--muted); text-decoration:none; font-size:13.5px; font-weight:500; padding:7px 12px; border-radius:7px; transition:.15s; }
  .nav a:hover { color:var(--text); background:var(--panel); }
  .nav a.active { color:var(--text); background:var(--panel2); }

  main { max-width:1080px; margin:0 auto; padding:24px 22px; }
  .stats { display:flex; gap:14px; margin-bottom:22px; flex-wrap:wrap; }
  .stat { flex:1; min-width:130px; background:linear-gradient(180deg,rgba(255,255,255,.015),transparent), var(--panel);
      border:1px solid var(--border-soft); border-radius:12px; padding:15px 18px; box-shadow:var(--shadow); }
  .stat .n { font-size:28px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
  .stat .l { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-top:2px; }

  .empty { text-align:center; color:var(--muted); padding:90px 20px; display:flex; flex-direction:column; align-items:center; gap:14px; }
  .empty svg { width:40px; height:40px; color:var(--muted2); stroke-width:1.4; }

  .card { background:linear-gradient(180deg,rgba(255,255,255,.015),transparent), var(--panel);
      border:1px solid var(--border-soft); border-radius:14px; padding:18px 20px; margin-bottom:14px; box-shadow:var(--shadow); transition:.18s; }
  .card:hover { border-color:var(--border); }
  .card.highlight { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), var(--shadow-lg); }
  .card.pending { border-left:3px solid var(--warn); }
  .card-head { display:flex; align-items:center; gap:11px; flex-wrap:wrap; }
  .card-head .ns { font-weight:600; font-size:15px; letter-spacing:-.01em; }
  .card-head .id { font-family:var(--mono); font-size:12px; color:var(--muted2); }
  .badge { font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:20px; display:flex; align-items:center; gap:5px; }
  .b-pending { background:rgba(210,153,34,.14); color:var(--warn); }
  .b-approved,.b-executed { background:rgba(79,143,247,.14); color:var(--accent); }
  .b-resolved { background:rgba(63,185,80,.14); color:var(--ok); }
  .b-rejected,.b-failed,.b-timeout { background:rgba(248,81,73,.14); color:var(--error); }
  .b-escalated,.b-blocked { background:rgba(188,140,255,.14); color:var(--purple); }
  .risk { font-size:11.5px; padding:3px 9px; border-radius:7px; font-weight:600; font-family:var(--mono); }
  .r0{background:rgba(63,185,80,.12);color:var(--ok)} .r1{background:rgba(79,143,247,.12);color:var(--accent)}
  .r2{background:rgba(210,153,34,.12);color:var(--warn)} .r3{background:rgba(248,81,73,.12);color:var(--error)}
  .recur { font-family:var(--mono); font-size:11.5px; color:#fbbf24; background:rgba(251,191,36,.12); border:1px solid rgba(251,191,36,.3); border-radius:6px; padding:1px 7px; }
  .catbadge { font-size:10px; font-weight:bold; text-transform:uppercase; letter-spacing:.5px; border-radius:6px; padding:2px 8px; }
  .catbadge.app { color:#60a5fa; background:rgba(96,165,250,.12); border:1px solid rgba(96,165,250,.3); }
  .catbadge.platform { color:#c084fc; background:rgba(192,132,252,.12); border:1px solid rgba(192,132,252,.3); }
  .filterbar { display:flex; gap:8px; margin-bottom:14px; }
  .filterbtn { font-size:12px; color:var(--muted); background:var(--rail); border:1px solid var(--border-soft); border-radius:8px; padding:6px 14px; cursor:pointer; }
  .filterbtn.active { color:var(--text); border-color:var(--blue); background:rgba(96,165,250,.1); }
  .filterbtn:hover { color:var(--text); }
  .score { margin-left:auto; font-family:var(--mono); font-size:12.5px; color:var(--muted); }
  .section { margin-top:15px; }
  .section .label { font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted2); margin-bottom:6px; font-weight:600; }
  .rc { background:var(--panel2); border-radius:9px; padding:11px 14px; font-size:14px; line-height:1.5; }
  .cmd { font-family:var(--mono); font-size:12.5px; background:var(--rail); color:#7ee0c0; padding:11px 14px;
      border-radius:9px; overflow-x:auto; border:1px solid var(--border-soft); }
  .cmd-help { font-size:11.5px; color:var(--muted); margin-top:5px; line-height:1.5; padding-left:2px; }
  .cmd-help::before { content:'↳ '; color:var(--dim); }
  .execlog { background:#0a0e14; border:1px solid var(--border-soft); border-radius:9px; padding:10px 12px;
      font-family:var(--mono); font-size:12px; display:flex; flex-direction:column; gap:9px; overflow-x:auto; }
  .exec-step { border-left:2px solid var(--border-soft); padding-left:10px; }
  .exec-step.s-done { border-left-color:var(--ok); }
  .exec-step.s-failed { border-left-color:var(--error); }
  .exec-step.s-running { border-left-color:var(--warn); }
  .exec-step.s-manual { border-left-color:var(--teal); }
  .exec-h { display:flex; align-items:center; gap:8px; }
  .exec-ic { width:14px; text-align:center; }
  .s-done .exec-ic { color:var(--ok); }
  .s-failed .exec-ic { color:var(--error); }
  .s-running .exec-ic { color:var(--warn); animation:spin 1.1s linear infinite; display:inline-block; }
  .s-manual .exec-ic { color:var(--teal); }
  .exec-t { font-size:9.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--dim);
      border:1px solid var(--border-soft); border-radius:5px; padding:1px 5px; }
  .exec-cmd { color:#7ee0c0; }
  .exec-out { color:#9fb3c8; white-space:pre-wrap; margin:5px 0 0 22px; line-height:1.5;
      max-height:140px; overflow-y:auto; }
  .live { font-size:10px; font-weight:600; color:var(--warn); margin-left:6px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .extnote { margin-top:11px; font-size:12.5px; color:var(--muted); background:rgba(210,153,34,.08);
      border:1px solid rgba(210,153,34,.3); border-radius:8px; padding:10px 13px; line-height:1.55; }
  .extnote-h { display:block; color:var(--warn); font-weight:600; font-size:11.5px; margin-bottom:4px;
      text-transform:uppercase; letter-spacing:.03em; }
  .stepplay { margin-left:auto; font-size:11.5px; font-weight:600; color:#03260f;
      background:linear-gradient(180deg,#3fb950,#2ea043); border:none; border-radius:7px;
      padding:5px 12px; line-height:1; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
      letter-spacing:.01em; transition:.15s; }
  .stepplay:hover:not(:disabled) { filter:brightness(1.1); }
  .stepplay:disabled { cursor:not-allowed; }
  .stepplay.blocked { opacity:.4; }
  .stepplay .tri { font-size:10px; }
  .stepplay.running { background:rgba(210,153,34,.16); color:var(--warn); cursor:wait; }
  .stepplay.running .tri { animation:spin 1s linear infinite; display:inline-block; }
  .stepplay.done { background:rgba(63,185,80,.14); color:var(--ok); cursor:default; }
  .stepplay.failed { background:rgba(248,81,73,.14); color:var(--error); }
  .sol-tag { font-size:10px; font-weight:400; color:var(--dim); border:1px solid var(--border-soft);
      border-radius:6px; padding:1px 6px; margin-left:7px; text-transform:none; letter-spacing:0; }
  ol.plan { list-style:none; counter-reset:none; display:flex; flex-direction:column; gap:9px; }
  .plan-step { border-left:2px solid var(--border-soft); padding-left:11px; }
  .step-h { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
  .step-num { display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px;
      border-radius:50%; background:var(--rail); color:var(--muted); font-size:11px; font-weight:600; }
  .step-type { font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--dim); }
  .step-type.command { color:var(--teal); }
  .step-risk { font-size:10px; border:1px solid var(--border-soft); border-radius:5px; padding:0 5px; color:var(--muted); }
  .step-risk.r1 { color:var(--warn); border-color:var(--warn); }
  .invest { list-style:none; font-size:12.5px; color:var(--muted); font-family:var(--mono); }
  .invest li { padding:3px 0 3px 16px; position:relative; }
  .invest li::before { content:""; position:absolute; left:2px; top:9px; width:5px; height:5px; border-radius:50%; background:var(--teal); }
  button { font-family:inherit; font-size:14px; font-weight:600; padding:10px 20px; border:none; border-radius:9px; cursor:pointer;
      display:flex; align-items:center; gap:7px; transition:.15s; }
  button:hover { filter:brightness(1.08); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .done { font-size:13px; color:var(--muted); margin-top:15px; font-style:italic; }
</style>
</head>
<body>
<header>
  <div class="logo"><svg class="icon" viewBox="0 0 24 24"><path d="M12 2 4 6v6c0 5 3.4 8.5 8 10 4.6-1.5 8-5 8-10V6z"/><path d="m9 12 2 2 4-4"/></svg></div>
  <div class="brand">K8s-AIOps <span>· Incidencias</span></div>
  <nav class="nav" style="margin-left:18px">
    <a href="/">Dashboard</a><a href="/incidents" class="active">Incidencias</a>
    <a href="/topology">Topología</a><a href="/security">Seguridad</a>
    <a href="/graph">Grafo</a>
  </nav>
  <span class="live"><span class="pulse"></span>en vivo</span>
</header>

<main>
  <div class="stats" id="stats"></div>
  <div class="filterbar" id="filterbar">
    <button class="filterbtn active" data-cat="all" onclick="setFilter('all')">Todos</button>
    <button class="filterbtn" data-cat="app" onclick="setFilter('app')">App</button>
    <button class="filterbtn" data-cat="platform" onclick="setFilter('platform')">Plataforma</button>
  </div>
  <div id="list"><div class="empty"><div class="spinner"></div>Cargando incidencias…</div></div>
</main>

<script>
const STATUS_LABEL={pending_approval:"Pendiente",approved:"Aprobado",rejected:"Rechazado",executed:"Ejecutado",resolved:"Resuelto",failed:"Fallido",escalated:"Escalado",blocked:"Bloqueado",timeout:"Sin respuesta"};
const STATUS_CLASS={pending_approval:"b-pending",approved:"b-approved",executed:"b-executed",resolved:"b-resolved",rejected:"b-rejected",failed:"b-failed",timeout:"b-timeout",escalated:"b-escalated",blocked:"b-blocked"};
const RISK_LABEL={0:"lectura",1:"reversible",2:"configuración",3:"destructivo"};
const pathId = location.pathname.match(/\/incidents\/(.+)$/)?.[1];
function esc(s){ return (s||"").replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function execState(i, order){
  const e = (i.execution_log||[]).filter(x=>x.order===order).pop();
  return e ? e.status : null;   // running | done | failed | null
}
async function runStep(id, order, btn){
  if(btn){ btn.classList.add("running"); btn.disabled=true; btn.innerHTML='<span class="tri">⟳</span> Ejecutando…'; }
  document.querySelectorAll(`[data-inc="${id}"] .stepplay`).forEach(b=>{ if(b!==btn) b.disabled=true; });
  try {
    await fetch(`/api/incidents/${id}/run-step`,{method:"POST",
      headers:{"Content-Type":"application/json"}, body:JSON.stringify({order})});
    await load();
  } catch(e){
    if(btn){ btn.classList.remove("running"); btn.innerHTML='<span class="tri">▶</span> Ejecutar'; }
    document.querySelectorAll(`[data-inc="${id}"] .stepplay`).forEach(b=>b.disabled=false);
  }
}
function toggleLogs(id){
  if(openLogs.has(id)) openLogs.delete(id); else openLogs.add(id);
  const b=document.getElementById("pl-"+id);
  if(b) b.style.display = openLogs.has(id) ? "block" : "none";
}
function renderStats(items){
  const pending=items.filter(i=>i.status==="pending_approval").length;
  const resolved=items.filter(i=>i.status==="resolved").length;
  const failed=items.filter(i=>["failed","timeout"].includes(i.status)).length;
  document.getElementById("stats").innerHTML=`
    <div class="stat"><div class="n">${items.length}</div><div class="l">Total</div></div>
    <div class="stat"><div class="n" style="color:var(--warn)">${pending}</div><div class="l">Pendientes</div></div>
    <div class="stat"><div class="n" style="color:var(--ok)">${resolved}</div><div class="l">Resueltos</div></div>
    <div class="stat"><div class="n" style="color:var(--error)">${failed}</div><div class="l">Fallidos</div></div>`;
}
function extNote(i){
  return i.remediation_guidance
    ? `<div class="extnote"><span class="extnote-h">⚠ Requiere acción externa</span>${esc(i.remediation_guidance)}</div>`
    : "";
}
function solutionSection(i){
  const plan = i.remediation_plan || [];
  if (plan.length) {
    const srcMap = {graph:"grafo", escalated:"escalado", catalog:"catálogo"};
    const src = srcMap[i.solution_source] || "grafo";
    const tlabel = {investigate:"Investigar", command:"Aplicar", verify:"Verificar"};
    const pendingNow = i.status==="pending_approval";
    const hasCmd = plan.some(s=>s.action_type==="command");
    const steps = plan.map((s,idx)=>{
      const body = `<div class="cmd">${esc(s.action)}</div>`;
      const expl = s.explanation ? `<div class="cmd-help">${esc(s.explanation)}</div>` : "";
      const risk = (s.risk_level>0) ? `<span class="step-risk r${s.risk_level}">L${s.risk_level}</span>` : "";
      const order = idx + 1;
      const state = execState(i, order);   // done | running | failed | null
      let play;
      if (state === "done") {
        play = `<button class="stepplay done" disabled>✓ Hecho</button>`;
      } else if (state === "running") {
        play = `<button class="stepplay running" disabled><span class="tri">⟳</span> Ejecutando…</button>`;
      } else if (state === "failed") {
        play = pendingNow
          ? `<button class="stepplay failed" onclick="runStep('${i.id}',${order},this)" title="Reintentar este paso"><span class="tri">▶</span> Reintentar</button>`
          : `<button class="stepplay failed" disabled>✗ Falló</button>`;
      } else if (pendingNow) {
        play = `<button class="stepplay" onclick="runStep('${i.id}',${order},this)" title="Ejecutar este paso"><span class="tri">▶</span> Ejecutar</button>`;
      } else {
        play = "";
      }
      return `<li class="plan-step"><div class="step-h"><span class="step-num">${idx+1}</span><span class="step-type ${s.action_type}">${tlabel[s.action_type]||s.action_type}</span>${risk}${play}</div>${body}${expl}</li>`;
    }).join("");
    // Sin comando ejecutable en el plan → mostrar la nota de acción externa.
    const note = hasCmd ? "" : extNote(i);
    return `<div class="section"><div class="label">Solución <span class="sol-tag">plan · ${src} · shadow</span></div><ol class="plan">${steps}</ol>${note}</div>`;
  }
  if (i.remediation_command)
    return `<div class="section"><div class="label">Solución <span class="sol-tag">shadow · requiere aprobación</span></div><div class="cmd">${esc(i.remediation_command)}</div>${i.remediation_explanation?`<div class="cmd-help">${esc(i.remediation_explanation)}</div>`:""}</div>`;
  if (i.remediation_guidance)
    return `<div class="section"><div class="label">Solución</div>${extNote(i)}</div>`;
  return `<div class="section"><div class="label">Investigar</div><div class="cmd">${esc(i.kubectl_cmd)}</div>${i.command_explanation?`<div class="cmd-help">${esc(i.command_explanation)}</div>`:""}</div>`;
}
function execSection(i){
  const log=i.execution_log||[];
  if(!log.length){
    return i.execution_output
      ? `<div class="section"><div class="label">Resultado</div><div class="execlog"><div class="exec-step s-done"><span class="exec-ic">✓</span><span class="exec-cmd">${esc(i.kubectl_cmd)}</span><div class="exec-out">${esc(i.execution_output).slice(0,500)}</div></div></div></div>`
      : "";
  }
  const ic={running:"⟳",done:"✓",failed:"✗",manual:"•"};
  const tlab={investigate:"investigar",command:"aplicar",guidance:"manual",verify:"verificar"};
  const rows=log.map(s=>{
    const head=(s.type==="verify"||s.type==="guidance")
      ? `<span class="exec-cmd">${esc(s.command)}</span>`
      : `<span class="exec-cmd">$ ${esc(s.command)}</span>`;
    const out=s.output?`<div class="exec-out">${esc(s.output).slice(0,500)}</div>`:"";
    return `<div class="exec-step s-${s.status}"><div class="exec-h"><span class="exec-ic">${ic[s.status]||'·'}</span><span class="exec-t">${tlab[s.type]||s.type}</span>${head}</div>${out}</div>`;
  }).join("");
  const running=log.some(s=>s.status==="running");
  return `<div class="section"><div class="label">Ejecución ${running?'<span class="live">● en vivo</span>':''}</div><div class="execlog">${rows}</div></div>`;
}
function card(i){
  const pending=i.status==="pending_approval";
  const invest=(i.investigation||[]).map(s=>`<li>${esc(s)}</li>`).join("");
  const inflight=i.status==="approved"||i.status==="executed";
  let actions;
  if (i.response==="approved") {
    actions=inflight
      ? `<div class="done">⏳ Ejecutando y verificando… (≈90&nbsp;s)</div>`
      : `<div class="done">✓ ${i.verified===true?"anomalía resuelta":i.verified===false?"la anomalía persiste tras el fix":"ejecutado"}.</div>`;
  } else if (i.response==="rejected") {
    actions=`<div class="done">Descartado.</div>`;
  } else {
    actions="";
  }
  const exec=execSection(i);
  return `
  <div class="card ${pending?'pending':''} ${i.id===pathId?'highlight':''}" data-inc="${i.id}">
    <div class="card-head">
      <span class="ns">${esc(i.namespaces.join(", "))}</span>
      <span class="catbadge ${(i.category||'app')}">${(i.category||'app')==='platform'?'Plataforma':'App'}</span>
      <span class="badge ${STATUS_CLASS[i.status]||''}">${STATUS_LABEL[i.status]||i.status}</span>
      <span class="risk r${i.risk_level}">L${i.risk_level} · ${RISK_LABEL[i.risk_level]||''}</span>
      <span class="id">${i.id}</span>
      ${i.occurrence_count>1?`<span class="recur" title="Problema recurrente (deduplicado)">↻ visto ${i.occurrence_count} veces</span>`:""}
      <span class="score">score ${i.score.toFixed(3)}</span>
    </div>
    ${invest?`<div class="section"><div class="label">Investigación</div><ul class="invest">${invest}</ul></div>`:""}
    <div class="section"><div class="label">Diagnóstico</div><div class="rc">${esc(i.root_cause)}</div></div>
    ${solutionSection(i)}
    ${exec}${actions}
    <div class="chatrow"><button class="chatbtn" onclick="openChat('${i.id}')">💬 Chat de remediación</button></div>
    ${i.prompt_user?`<div class="teach">
      <button class="teachbtn" onclick="toggleLogs('${i.id}')">📄 Ver logs del problema</button>
      <div class="problemlogs" id="pl-${i.id}" style="display:${openLogs.has(i.id)?'block':'none'}">${esc(i.prompt_user)}</div>
    </div>`:""}
  </div>`;
}
let allItems=[];
let catFilter="all";
const openLogs=new Set();  // paneles de logs abiertos (persisten entre refrescos de 3s)
function setFilter(c){
  catFilter=c;
  document.querySelectorAll(".filterbtn").forEach(b=>b.classList.toggle("active", b.dataset.cat===c));
  renderList();
}
function renderList(){
  const list=document.getElementById("list");
  const items = catFilter==="all" ? allItems : allItems.filter(i=>(i.category||"app")===catFilter);
  if(!allItems.length){
    list.innerHTML=`<div class="empty">
      <svg class="icon" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
      <span>Sin incidencias. El sistema avisará por Teams cuando detecte una anomalía.</span></div>`;
    return;
  }
  list.innerHTML = items.length
    ? items.map(card).join("")
    : `<div class="empty"><span>Sin incidencias en esta categoría.</span></div>`;
}
function renderFilterCounts(){
  const app=allItems.filter(i=>(i.category||"app")==="app").length;
  const plat=allItems.filter(i=>(i.category||"app")==="platform").length;
  const set=(cat,base,n)=>{const b=document.querySelector(`.filterbtn[data-cat="${cat}"]`); if(b) b.textContent=`${base} (${n})`;};
  set("all","Todos",allItems.length); set("app","App",app); set("platform","Plataforma",plat);
}
async function load(){
  try {
    const data=await (await fetch("/api/incidents")).json();
    allItems=data.incidents||[];
    renderStats(allItems);
    renderFilterCounts();
    renderList();
  } catch(e){ document.getElementById("list").innerHTML=`<div class="empty">Error al cargar incidencias.</div>`; }
}
load(); setInterval(load, 3000);

// ── Chat de remediación (drawer contextual a una incidencia) ────────────────
// El modelo investiga en solo-lectura y PROPONE; la ejecución del plan aplicado
// va por los botones ▶ de la tarjeta (run-step, con aprobación). El drawer vive
// fuera de #list para sobrevivir al refresco de 3 s.
let chatInc=null;
let chatMsgs=[];   // {role:'user'|'assistant'|'sys', text, observations?, plan?}
let chatBusy=false;

function openChat(id){
  chatInc=id; chatMsgs=[];
  const inc=allItems.find(x=>x.id===id);
  document.getElementById("chat-title").textContent="Chat · "+id;
  document.getElementById("chat-sub").textContent=inc?inc.root_cause:"";
  renderChat();
  document.getElementById("chat-drawer").classList.add("open");
  document.getElementById("chat-input").focus();
}
function closeChat(){ document.getElementById("chat-drawer").classList.remove("open"); chatInc=null; }

function planPreview(plan, mi){
  if(!plan||!plan.length) return "";
  const tl={investigate:"Investigar",command:"Aplicar"};
  const rows=plan.map((s,i)=>`<li><span class="ct-type ${s.type}">${tl[s.type]||s.type}</span>
    <code>${esc(s.action)}</code>${s.risk>0?`<span class="ct-risk r${s.risk}">L${s.risk}</span>`:""}
    ${s.explanation?`<div class="ct-expl">${esc(s.explanation)}</div>`:""}</li>`).join("");
  return `<div class="ct-plan"><div class="ct-plan-h">Plan propuesto (${plan.length} pasos)</div>
    <ol>${rows}</ol>
    <button class="ct-apply" onclick="applyPlan(${mi})">Aplicar al incidente →</button>
    <div class="ct-note">Se adjunta al incidente; ejecutas cada paso con ▶ (dry-run + aprobación).</div></div>`;
}
function renderChat(){
  const b=document.getElementById("chat-body");
  b.innerHTML = chatMsgs.map((m,mi)=>{
    if(m.role==="sys") return `<div class="ct-sys">${esc(m.text)}</div>`;
    const obs=(m.observations||[]).map(o=>`<details class="ct-obs"><summary>🔍 ${esc(o.action)}</summary><pre>${esc(o.output).slice(0,1500)}</pre></details>`).join("");
    const plan=planPreview(m.plan, mi);
    return `<div class="ct-msg ${m.role}"><div class="ct-bubble">${esc(m.text)||(obs?"":"…")}</div>${obs}${plan}</div>`;
  }).join("");
  b.scrollTop=b.scrollHeight;
}
async function sendChat(){
  if(chatBusy||!chatInc) return;
  const inp=document.getElementById("chat-input");
  const msg=inp.value.trim(); if(!msg) return;
  inp.value=""; chatMsgs.push({role:"user",text:msg});
  chatMsgs.push({role:"assistant",text:"pensando…"}); renderChat();
  chatBusy=true; document.getElementById("chat-send").disabled=true;
  try{
    const r=await fetch("/api/chat/remediation",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({incident_id:chatInc, message:msg})});
    const j=await r.json();
    chatMsgs.pop(); // quita "pensando…"
    if(!r.ok){ chatMsgs.push({role:"sys",text:j.error||"Error del chat"}); }
    else { chatMsgs.push({role:"assistant", text:j.reply||"", observations:j.observations||[], plan:j.proposed_plan||[]}); }
  }catch(e){ chatMsgs.pop(); chatMsgs.push({role:"sys",text:"Error de red"}); }
  finally{ chatBusy=false; document.getElementById("chat-send").disabled=false; renderChat(); }
}
async function applyPlan(mi){
  const m=chatMsgs[mi]; if(!m||!m.plan||!m.plan.length||!chatInc) return;
  try{
    const r=await fetch("/api/chat/remediation/apply",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({incident_id:chatInc, steps:m.plan})});
    const j=await r.json();
    chatMsgs.push({role:"sys", text: r.ok?`Plan aplicado (${j.steps} pasos). Ejecútalo con ▶ en la tarjeta.`:(j.error||"No se pudo aplicar")});
    renderChat(); await load();
  }catch(e){ chatMsgs.push({role:"sys",text:"Error de red al aplicar"}); renderChat(); }
}
</script>
<style>.spinner{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.teach{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px dashed var(--border);font-size:13px}
.teachlink{color:var(--accent);text-decoration:none}
.teachlink:hover{text-decoration:underline}
.problemlogs{margin-top:10px;background:#0a0e14;border:1px solid var(--border-soft);border-radius:9px;
  padding:11px 13px;font-family:var(--mono);font-size:12px;color:#9fb3c8;white-space:pre-wrap;
  line-height:1.5;max-height:280px;overflow:auto}
.teachbtn{cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--text);padding:5px 10px;border-radius:8px;font-size:13px}
.teachbtn:hover{border-color:var(--teal);color:var(--teal)}
.chatrow{margin-top:10px}
.chatbtn{cursor:pointer;border:1px solid var(--border);background:var(--panel2);color:#cfe0ff;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600}
.chatbtn:hover{border-color:var(--accent)}
.chat-drawer{position:fixed;top:0;right:0;height:100vh;width:min(460px,94vw);background:var(--panel);border-left:1px solid var(--border);
  box-shadow:-16px 0 48px rgba(0,0,0,.5);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s;z-index:60}
.chat-drawer.open{transform:translateX(0)}
.chat-h{padding:14px 16px;border-bottom:1px solid var(--border-soft);display:flex;align-items:flex-start;gap:10px}
.chat-h .tt{flex:1}
.chat-h .tt b{font-size:14px}
.chat-h .sub{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4;max-height:46px;overflow:hidden}
.chat-h .x{background:none;border:none;color:var(--muted2);font-size:16px;cursor:pointer}
.chat-h .x:hover{color:var(--error)}
.chat-body{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.ct-msg{display:flex;flex-direction:column;gap:6px;max-width:100%}
.ct-msg.user{align-items:flex-end}
.ct-bubble{padding:8px 12px;border-radius:12px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;max-width:90%}
.ct-msg.user .ct-bubble{background:linear-gradient(180deg,#2563eb,#1d4ed8);color:#fff}
.ct-msg.assistant .ct-bubble{background:var(--panel2);color:var(--text);border:1px solid var(--border-soft)}
.ct-sys{font-size:12px;color:var(--muted);text-align:center;font-style:italic}
.ct-obs{background:#0a0e14;border:1px solid var(--border-soft);border-radius:8px;font-size:12px}
.ct-obs summary{cursor:pointer;padding:6px 10px;color:var(--teal);font-family:var(--mono)}
.ct-obs pre{margin:0;padding:8px 10px;border-top:1px solid var(--border-soft);color:#9fb3c8;font-size:11.5px;white-space:pre-wrap;overflow:auto;max-height:220px}
.ct-plan{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.ct-plan-h{font-size:12px;font-weight:700;margin-bottom:8px}
.ct-plan ol{margin:0 0 8px;padding-left:18px;display:flex;flex-direction:column;gap:7px}
.ct-plan code{font-family:var(--mono);font-size:12px;color:#cfe0ff;word-break:break-all}
.ct-type{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-right:6px;color:var(--muted)}
.ct-type.command{color:var(--warn)}
.ct-risk{font-size:10px;margin-left:6px;color:var(--warn)}
.ct-expl{font-size:11.5px;color:var(--muted2);margin-top:2px}
.ct-apply{cursor:pointer;background:linear-gradient(180deg,#2563eb,#1d4ed8);color:#fff;border:none;border-radius:8px;padding:7px 13px;font-size:12.5px;font-weight:600}
.ct-note{font-size:11px;color:var(--muted2);margin-top:6px}
.chat-f{padding:12px 14px;border-top:1px solid var(--border-soft);display:flex;gap:8px}
.chat-f input{flex:1;background:var(--rail);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:13px;font-family:inherit}
.chat-f button{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:0 15px;font-size:13px;font-weight:600;cursor:pointer}
.chat-f button:disabled{opacity:.5;cursor:wait}</style>

<div id="chat-drawer" class="chat-drawer">
  <div class="chat-h">
    <div class="tt"><b id="chat-title">Chat de remediación</b><div class="sub" id="chat-sub"></div></div>
    <button class="x" onclick="closeChat()">✕</button>
  </div>
  <div id="chat-body" class="chat-body"></div>
  <div class="chat-f">
    <input id="chat-input" placeholder="Pregunta o pide un plan…" onkeydown="if(event.key==='Enter')sendChat()">
    <button id="chat-send" onclick="sendChat()">Enviar</button>
  </div>
</div>
</body>
