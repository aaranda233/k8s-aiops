<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K8s-AIOps — Informe Técnico</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #fafaf8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .gate {
    background: #fff;
    border: 1px solid #e5e2da;
    border-radius: 14px;
    padding: 48px 40px;
    width: 100%;
    max-width: 380px;
    text-align: center;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }
  @media (max-width: 420px) {
    .gate { padding: 36px 24px; }
  }
  .logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 52px; height: 52px;
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 12px;
    font-size: 24px;
    margin-bottom: 20px;
  }
  h1 { font-size: 20px; font-weight: 700; color: #1c1917; margin-bottom: 6px; }
  p  { font-size: 14px; color: #78716c; margin-bottom: 28px; line-height: 1.5; }
  input {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid #e5e2da;
    border-radius: 8px;
    font-size: 15px;
    color: #1c1917;
    background: #fafaf8;
    outline: none;
    transition: border-color 0.15s;
    margin-bottom: 12px;
    letter-spacing: 2px;
    text-align: center;
  }
  input:focus { border-color: #2563eb; background: #fff; }
  input.error { border-color: #ef4444; background: #fef2f2; animation: shake 0.3s; }
  @keyframes shake {
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-6px)}
    75%{transform:translateX(6px)}
  }
  button {
    width: 100%;
    padding: 11px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #1d4ed8; }
  button:active { background: #1e40af; }
  .err-msg { font-size: 13px; color: #ef4444; margin-top: 10px; min-height: 18px; }
</style>
</head>
<body>
<div class="gate">
  <div class="logo">🔒</div>
  <h1>Informe Técnico</h1>
  <p>Pipeline AIOps para Kubernetes.<br>Introduce la contraseña para continuar.</p>
  <input type="password" id="pwd" placeholder="Contraseña" autofocus
         onkeydown="if(event.key==='Enter') verify()">
  <button onclick="verify()">Acceder</button>
  <div class="err-msg" id="err"></div>
</div>

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256',
    new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf))
    .map(b => b.toString(16).padStart(2,'0')).join('');
}

async function verify() {
  const input = document.getElementById('pwd');
  const err   = document.getElementById('err');
  const hash  = await sha256(input.value);
  if (hash === HASH) {
    sessionStorage.setItem('k8s_auth', '1');
    load();
  } else {
    input.classList.add('error');
    err.textContent = 'Contraseña incorrecta.';
    input.value = '';
    setTimeout(() => {
      input.classList.remove('error');
      err.textContent = '';
    }, 2000);
  }
}

function load() {
  const bytes = Uint8Array.from(atob(CONTENT), c => c.charCodeAt(0));
  const html = new TextDecoder('utf-8').decode(bytes);
  document.open(); document.write(html); document.close();
}

if (sessionStorage.getItem('k8s_auth') === '1') load();
