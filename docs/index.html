<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

    display: flex;
    align-items: center;
    justify-content: center;
  }
  .gate {
    background: #fff;
    border: 1px solid #e5e2da;
    border-radius: 14px;
    padding: 48px 40px;
    width: 100%;
    max-width: 380px;
    text-align: center;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }

    align-items: center;
    justify-content: center;
    width: 52px; height: 52px;
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 12px;
    font-size: 24px;
    margin-bottom: 20px;
  }

  p  { font-size: 14px; color: #78716c; margin-bottom: 28px; line-height: 1.5; }

    width: 100%;
    padding: 11px 14px;
    border: 1px solid #e5e2da;
    border-radius: 8px;
    font-size: 15px;
    color: #1c1917;
    background: #fafaf8;
    outline: none;
    transition: border-color 0.15s;
    margin-bottom: 12px;
    letter-spacing: 2px;
    text-align: center;
  }
  input:focus { border-color: #2563eb; background: #fff; }
  input.error { border-color: #ef4444; background: #fef2f2; }
  button {
    width: 100%;
    padding: 11px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #1d4ed8; }
  .err-msg { font-size: 13px; color: #ef4444; margin-top: 10px; display: none; }
  .err-msg.show { display: block; }
</style>

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256',
    new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf))
    .map(b => b.toString(16).padStart(2,'0')).join('');
}

    load();

    input.value = '';
    setTimeout(() => {
      input.classList.remove('error');
      document.getElementById('err').classList.remove('show');
    }, 2000);
  }
}

function load() {
  const html = atob(CONTENT);
  document.open(); document.write(html); document.close();
}

if (sessionStorage.getItem('k8s_auth') === '1') load();
</script>
</body>
